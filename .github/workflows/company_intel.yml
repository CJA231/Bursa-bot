# 公司情报 (AI 分析)：DeepSeek 逐家整理「最近发生什么事」，写到 docs/intel/。跟每日筛选分开跑 (cron-job.org 只触发 daily.yml)。
# 两种：
#  - 每次报告 (daily.yml) 跑完就自动接着跑「新公告」模式 (workflow_run)：只重新整理有新的非例行公告的公司，每次最多 20 家，
#    所以盘中和晚上的报告时段 (cron-job.org) 一跑，公告大约 30 分钟内就反映到 AI 资讯和日历
#  - 每天晚上 19:17 一次完整轮换 (没有资讯 / 超过 7 天没更新的公司)，最多 limit 家
# 也可以在 Actions 手动跑。资料没变的不重复问 DeepSeek。
name: Company intel (DeepSeek)

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 马来西亚时间 19:17 (收盘后)，周一到周五
  workflow_run:               # 每次报告跑完 → 新公告模式
    workflows: ["DeepSeek Stock Bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      new_only:
        description: '只做有新公告的公司 (跟报告跑完后自动跑的一样)'
        type: boolean
        default: false
      limit:
        description: '这次最多处理几家 (约 1,100 家，每家 1 次 DeepSeek)'
        default: '120'
      codes:
        description: '只做这几家 (逗号分隔的代码，例如 5335,1155；留空 = 按顺序补)'
        default: ''
      force:
        description: '资料没变也重新分析'
        type: boolean
        default: false

permissions:
  contents: write

# 不跟每日报告排同一组：公司资讯第一次补资料可能跑很久，同一组的话报告只能干等，再来一个就被 GitHub 取消 (一组只能 1 个在跑 + 1 个在等)。
# 两边写的文件不重叠 (报告不写 docs/intel、holders、filings、segments)，push 前 pull --rebase + 重试就不会冲突。
# 排队组放在 job 上：报告被取消时触发的那次 (job 被 if 跳过) 不会进来把正在等的挤掉
jobs:
  intel:
    concurrency:
      group: company-intel
      cancel-in-progress: false
    # 报告失败 / 被取消就不跟着跑
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Analyse companies
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PYTHONUNBUFFERED: '1'
          NEW: ${{ (github.event_name == 'workflow_run' || github.event.inputs.new_only == 'true') && '--new' || '' }}
          LIMIT: ${{ github.event.inputs.limit || (github.event_name == 'workflow_run' && '20' || '120') }}
          CODES: ${{ github.event.inputs.codes || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python scripts/company_intel.py $NEW --limit "$LIMIT" --codes "$CODES" $FORCE | tee intel_log.txt
          { echo '### 公司情报'; echo '```'; tail -n 40 intel_log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # 主要股东持股 (程序读公告，不用 AI)、原始财报文件索引 (只存 Bursa 原文网址)、业务板块动态 (DeepSeek)；任何一个失败都不影响发布
      - name: Shareholders, filings, segments
        continue-on-error: true
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PYTHONUNBUFFERED: '1'
          CODES: ${{ github.event.inputs.codes || '' }}
        run: |
          python scripts/holders.py --codes "$CODES" --limit 25 | tee extra_log.txt
          python scripts/filings.py --codes "$CODES" --limit 25 | tee -a extra_log.txt
          python scripts/segments.py --codes "$CODES" --limit 12 | tee -a extra_log.txt
          { echo '### 股东 / 财报文件 / 业务板块'; echo '```'; grep -v '^   ' extra_log.txt | tail -n 20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/intel docs/holders docs/filings docs/segments
          git diff --staged --quiet && exit 0
          git commit -m "Update company intel, shareholders, filings, segments"
          # 别的流程 (报告 / 公司资讯 / ESG) 可能同时推送：接上最新的再推，被拒就等一下重试
          for i in 1 2 3 4 5; do
            { git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; false; }; } && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
          done
