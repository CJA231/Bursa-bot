# 公司情报 (AI 分析)：DeepSeek 逐家整理「最近发生什么事」，写到 docs/intel/。跟每日筛选分开跑 (cron-job.org 只触发 daily.yml)。
# 两种：
#  - 每次报告 (daily.yml) 跑完就自动接着跑「新公告」模式 (workflow_run)：只重新整理有新的非例行公告的公司，每次最多 20 家，
#    所以盘中和晚上的报告时段 (cron-job.org) 一跑，公告大约 30 分钟内就反映到 AI 资讯和日历
#  - 每天晚上 19:17 一次完整轮换 (没有资讯 / 超过 7 天没更新的公司)，最多 limit 家
# 也可以在 Actions 手动跑。资料没变的不重复问 DeepSeek。
name: Company intel (DeepSeek)

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 马来西亚时间 19:17 (收盘后)，周一到周五
  workflow_run:               # 每次报告跑完 → 新公告模式
    workflows: ["DeepSeek Stock Bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      new_only:
        description: '只做有新公告的公司 (跟报告跑完后自动跑的一样)'
        type: boolean
        default: false
      limit:
        description: '这次最多处理几家 (约 1,100 家，每家 1 次 DeepSeek)'
        default: '120'
      codes:
        description: '只做这几家 (逗号分隔的代码，例如 5335,1155；留空 = 按顺序补)'
        default: ''
      force:
        description: '资料没变也重新分析'
        type: boolean
        default: false

permissions:
  contents: write

# 跟每日报告同一组：轮流跑，不会同时 git push 撞在一起
concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  intel:
    # 报告失败 / 被取消就不跟着跑
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Analyse companies
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PYTHONUNBUFFERED: '1'
          NEW: ${{ (github.event_name == 'workflow_run' || github.event.inputs.new_only == 'true') && '--new' || '' }}
          LIMIT: ${{ github.event.inputs.limit || (github.event_name == 'workflow_run' && '20' || '120') }}
          CODES: ${{ github.event.inputs.codes || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python scripts/company_intel.py $NEW --limit "$LIMIT" --codes "$CODES" $FORCE | tee intel_log.txt
          { echo '### 公司情报'; echo '```'; tail -n 40 intel_log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/intel
          git diff --staged --quiet && exit 0
          git commit -m "Update company intel"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
