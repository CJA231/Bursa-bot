name: Update Watchlist

on:
  workflow_dispatch:  # 手动触发，新股上市/下市后再重新跑一次即可

permissions:
  contents: write

jobs:
  fetch_watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Malaysia watchlist from Yahoo Finance
        run: python scripts/fetch_watchlist.py

      - name: Commit watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          git diff --staged --quiet || git commit -m "Update watchlist from Yahoo Finance screener"
          git push
