name: Update Watchlist

on:
  workflow_dispatch:  # 手动触发 (平时 daily.yml 每天第一次跑报告时会自动更新)

permissions:
  contents: write

jobs:
  fetch_watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 网站资料在 site-data 分支 (main 不放生成的文件)：先放回 docs/ 和 data/
      - name: Restore site data
        run: python3 scripts/site_state.py restore

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Malaysia watchlist from Yahoo Finance
        run: python scripts/fetch_watchlist.py

      # 保存到 site-data 分支 (只换 data/watchlist*.json 和 docs/stock)
      - name: Commit watchlist
        run: python3 scripts/site_state.py save --role watchlist -m "Update watchlist from Yahoo Finance screener"
