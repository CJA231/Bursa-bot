name: Debug Stock

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: '股票代码 (例如 0453.KL)'
        required: true
      days_back:
        description: '额外往前看几天 (默认1，即只看今天+昨天)'
        required: false
        default: '1'

jobs:
  debug_stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run debug script
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: |
          # symbol 填 PROBE = 检查公告 / 新闻网站在 Actions 上连不连得上 (scripts/probe_sources.py)
          if [ "${{ github.event.inputs.symbol }}" = "PROBE4" ]; then python scripts/probe_sources.py --nav; exit 0; fi
          if [ "${{ github.event.inputs.symbol }}" = "PROBE3" ]; then python scripts/probe_sources.py --views; exit 0; fi
          if [ "${{ github.event.inputs.symbol }}" = "LATENCY" ]; then python scripts/ann_latency.py && python scripts/ann_latency.py --report; exit 0; fi
          if [ "${{ github.event.inputs.symbol }}" = "PROBE2" ]; then python scripts/probe_sources.py --lists; exit 0; fi
          if [ "${{ github.event.inputs.symbol }}" = "PROBE" ]; then python scripts/probe_sources.py --klse; python scripts/probe_sources.py; exit 0; fi
          python scripts/debug_stock.py "${{ github.event.inputs.symbol }}" --days-back "${{ github.event.inputs.days_back }}"
