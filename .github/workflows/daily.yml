name: DeepSeek Stock Bot

on:
  # GitHub 自带的 schedule 对本仓库延迟严重 (实测平均迟到 5.7 小时，密集排程时甚至完全不触发)，
  # 已改用外部定时器 (cron-job.org) 按当地时间精确调用下面的 workflow_dispatch 触发，
  # 详见 bursa-bot.md 第 5 节。
  workflow_dispatch:       # 允许手动按钮运行 / 外部定时器调用
    inputs:
      force:
        description: '忽略交易日检查，强制用最新可用数据跑一次 (用于测试)'
        type: boolean
        default: false
      market:
        description: '市场：MY = 马股 (docs/)，US = 美股 (docs/us/)。cron-job.org 的旧任务不传就是 MY'
        type: choice
        options: [MY, US]
        default: MY

permissions:
  contents: write

# 马股和美股的 run 如果同时触发，排队一个一个跑 (不取消)，不会同时 git push 撞在一起
concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    # 正常 1 分钟左右跑完。Yahoo 响应变慢时曾经拖到 11 分钟 (run #208)，
    # 设个上限，避免真的卡住时占着 runner 跑到默认的 6 小时
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 网站资料在 site-data 分支 (main 不放生成的文件)：先放回 docs/ 和 data/
      - name: Restore site data
        run: python3 scripts/site_state.py restore

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 缓存"已经装好的"整套 Python 包，而不是只缓存下载的安装包：
      # 以前 cache: 'pip' 只省了下载，真正安装 (numba/llvmlite/numpy/pandas) 每次还要 ~14 秒。
      # 缓存 key 带上 ISO 周数，每周自动重装一次，yfinance 这类经常修 bug 的包不会一直停在旧版本。
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore installed packages
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-${{ steps.week.outputs.week }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      # 股票名单每天更新一次 (当天第一次跑的时候)：新上市的股票当天就进报告，改名 / 下市也跟着改。
      # Yahoo 出错就保留旧名单 (脚本自己判断)，这一步失败也不挡报告
      - name: Refresh stock list (once a day)
        if: ${{ github.event.inputs.market != 'US' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/fetch_watchlist.py --if-stale

      - name: Run Stock Analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          MARKET: ${{ github.event.inputs.market || 'MY' }}
          SITE_URL: ${{ vars.SITE_URL }}  # 网站网址 (搬到 Cloudflare Pages 后设)；没设 = GitHub Pages
          PYTHONUNBUFFERED: '1'  # 不缓冲输出，Actions 日志里每一行的时间戳才是真实的 (以前全部挤在结束那一秒)
        run: python main.py

      # 记录各公告网站的延迟 (KLSE Screener vs i3investor，同一组股票的最新公告日期)，跟报告一起提交到 data/ann_latency.json。
      # 只是统计，出错不挡报告；看结果: python scripts/ann_latency.py --report
      - name: Record announcement source latency
        if: ${{ github.event.inputs.market != 'US' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: python scripts/ann_latency.py

      # 保存到 site-data 分支 (不提交到 main，仓库不会越来越大)；跑完后「Deploy site」会自动部署到 GitHub Pages。
      # 马股只换掉自己负责的路径 (docs/ 里 us、intel、holders、filings、segments、esg 以外的全部 + data/ 的状态文件)，美股只换 docs/us/
      - name: Publish report
        env:
          MARKET: ${{ github.event.inputs.market || 'MY' }}
        run: |
          if [ "$MARKET" = "US" ]; then
            python3 scripts/site_state.py save --role report-us -m "Update daily report (US)"
          else
            python3 scripts/site_state.py save --role report -m "Update daily report"
          fi

      # 公开展示站 (精简版，没有指标 / 规则 / 回测)：推到另一个公开仓库的根目录。
      # 需要在这个 (私有) 仓库设置：Secret PUBLIC_REPO_TOKEN (对公开仓库有 Contents 写权限的 fine-grained token)、Variable PUBLIC_REPO (例如 CJA231/Bursa-bot-public)。没设置就跳过
      - name: Publish public showcase
        if: ${{ github.event.inputs.market != 'US' }}
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ] || [ -z "$PUBLIC_REPO" ] || [ ! -d public_site ]; then echo "没有设置公开仓库，跳过"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${PUBLIC_REPO}.git" pub
          rsync -a --delete --exclude '.git' public_site/ pub/
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update public showcase"
          git push
