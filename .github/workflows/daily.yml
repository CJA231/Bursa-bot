name: DeepSeek Stock Bot

on:
  # GitHub 自带的 schedule 对本仓库延迟严重 (实测平均迟到 5.7 小时，密集排程时甚至完全不触发)，
  # 已改用外部定时器 (cron-job.org) 按马来西亚时间精确调用下面的 workflow_dispatch 触发，
  # 详见 bursa-bot.md 第 5 节。
  workflow_dispatch:       # 允许手动按钮运行 / 外部定时器调用
    inputs:
      force:
        description: '忽略交易日检查，强制用最新可用数据跑一次 (用于测试)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    # 正常 1 分钟左右跑完。Yahoo 响应变慢时曾经拖到 11 分钟 (run #208)，
    # 设个上限，避免真的卡住时占着 runner 跑到默认的 6 小时
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 缓存"已经装好的"整套 Python 包，而不是只缓存下载的安装包：
      # 以前 cache: 'pip' 只省了下载，真正安装 (numba/llvmlite/numpy/pandas) 每次还要 ~14 秒。
      # 缓存 key 带上 ISO 周数，每周自动重装一次，yfinance 这类经常修 bug 的包不会一直停在旧版本。
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore installed packages
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-${{ steps.week.outputs.week }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run Stock Analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          PYTHONUNBUFFERED: '1'  # 不缓冲输出，Actions 日志里每一行的时间戳才是真实的 (以前全部挤在结束那一秒)
        run: python main.py

      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update daily report"
          git push
