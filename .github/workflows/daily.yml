name: DeepSeek Stock Bot

on:
  schedule:
    # 时间点特意避开整点/半点，减少跟其他排程任务扎堆、被限流的风险；也是为了避开 DeepSeek API 高峰时段
    - cron: '15 1 * * 1-5'  # 9:15am  (UTC+8)
    - cron: '45 1 * * 1-5'  # 9:45am  (UTC+8)
    - cron: '15 2 * * 1-5'  # 10:15am (UTC+8)
    - cron: '45 2 * * 1-5'  # 10:45am (UTC+8)
    - cron: '30 3 * * 1-5'  # 11:30am (UTC+8)
    - cron: '25 4 * * 1-5'  # 12:25pm (UTC+8)
    - cron: '45 6 * * 1-5'  # 2:45pm  (UTC+8)
    - cron: '45 7 * * 1-5'  # 3:45pm  (UTC+8)
    - cron: '30 8 * * 1-5'  # 4:30pm  (UTC+8)
    - cron: '30 9 * * 1-5'  # 5:30pm  (UTC+8)
  workflow_dispatch:       # 允许手动按钮运行
    inputs:
      force:
        description: '忽略交易日检查，强制用最新可用数据跑一次 (用于测试)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python main.py

      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update daily report"
          git push
