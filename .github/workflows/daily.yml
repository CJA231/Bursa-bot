name: DeepSeek Stock Bot

on:
  # GitHub 自带的 schedule 对本仓库延迟严重 (实测平均迟到 5.7 小时，密集排程时甚至完全不触发)，
  # 已改用外部定时器 (cron-job.org) 按当地时间精确调用下面的 workflow_dispatch 触发，
  # 详见 bursa-bot.md 第 5 节。
  workflow_dispatch:       # 允许手动按钮运行 / 外部定时器调用
    inputs:
      force:
        description: '忽略交易日检查，强制用最新可用数据跑一次 (用于测试)'
        type: boolean
        default: false
      market:
        description: '市场：MY = 马股 (docs/)，US = 美股 (docs/us/)。cron-job.org 的旧任务不传就是 MY'
        type: choice
        options: [MY, US]
        default: MY

permissions:
  contents: write

# 马股和美股的 run 如果同时触发，排队一个一个跑 (不取消)，不会同时 git push 撞在一起
concurrency:
  group: publish-report
  cancel-in-progress: false

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    # 正常 1 分钟左右跑完。Yahoo 响应变慢时曾经拖到 11 分钟 (run #208)，
    # 设个上限，避免真的卡住时占着 runner 跑到默认的 6 小时
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 缓存"已经装好的"整套 Python 包，而不是只缓存下载的安装包：
      # 以前 cache: 'pip' 只省了下载，真正安装 (numba/llvmlite/numpy/pandas) 每次还要 ~14 秒。
      # 缓存 key 带上 ISO 周数，每周自动重装一次，yfinance 这类经常修 bug 的包不会一直停在旧版本。
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore installed packages
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-${{ steps.week.outputs.week }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Run Stock Analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          MARKET: ${{ github.event.inputs.market || 'MY' }}
          PYTHONUNBUFFERED: '1'  # 不缓冲输出，Actions 日志里每一行的时间戳才是真实的 (以前全部挤在结束那一秒)
        run: python main.py

      - name: Publish report
        env:
          MARKET: ${{ github.event.inputs.market || 'MY' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 整个 docs 目录一起提交 (-A 连删掉的文件也算)：报告、下载文件 (超过 7 天的旧文件夹会被删掉)、
          # charts = 表格股票的K线、stock = 个股财报 + 长期K线、news = 个股新闻；美股的同名目录都在 docs/us/ 下面
          git add -A docs
          if [ "$MARKET" = "US" ]; then msg="Update daily report (US)"; else msg="Update daily report"; fi
          git diff --staged --quiet || git commit -m "$msg"
          # 排队等上一个 run (例如另一个市场) 的时候，main 可能已经多了它推上去的报告 → 先接上再推。
          # 两个市场写的是不同目录 (docs/ 和 docs/us/)，不会冲突
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
