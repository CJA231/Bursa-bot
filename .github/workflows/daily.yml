name: DeepSeek Stock Bot

on:
  # GitHub 自带的 schedule 对本仓库延迟严重 (实测平均迟到 5.7 小时，密集排程时甚至完全不触发)，
  # 已改用外部定时器 (cron-job.org) 按马来西亚时间精确调用下面的 workflow_dispatch 触发，
  # 详见 bursa-bot.md 第 5 节。
  workflow_dispatch:       # 允许手动按钮运行 / 外部定时器调用
    inputs:
      force:
        description: '忽略交易日检查，强制用最新可用数据跑一次 (用于测试)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Analysis
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python main.py

      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update daily report"
          git push
