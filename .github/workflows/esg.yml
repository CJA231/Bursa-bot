# ESG / 可持续发展披露抽取 (IR + ESG 样品页)：从 data/esg/sources.json 里的公司报告 PDF 抽指标和 IFRS S1/S2 披露项目，写到 docs/esg/。
# sources.json 一改就自动跑 (只做 PDF 有变的公司)，也可以在 Actions 手动跑。
name: ESG extract (DeepSeek)

on:
  push:
    branches: [main]
    paths: ["data/esg/sources.json"]
  workflow_dispatch:
    inputs:
      codes:
        description: '只做这几家 (逗号分隔的代码；留空 = sources.json 全部)'
        default: ''
      force:
        description: 'PDF 没变也重新抽取'
        type: boolean
        default: false

permissions:
  contents: write

# 自己一组 (只写 docs/esg，跟报告、公司资讯不重叠)；push 前 pull --rebase + 重试
concurrency:
  group: esg-extract
  cancel-in-progress: false

jobs:
  esg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Extract
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          PYTHONUNBUFFERED: '1'
          CODES: ${{ github.event.inputs.codes || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: |
          python scripts/esg_extract.py --codes "$CODES" $FORCE | tee esg_log.txt
          { echo '### ESG'; echo '```'; tail -n 40 esg_log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/esg
          git diff --staged --quiet && exit 0
          git commit -m "Update ESG extracts"
          # 别的流程 (报告 / 公司资讯 / ESG) 可能同时推送：接上最新的再推，被拒就等一下重试
          for i in 1 2 3 4 5; do
            { git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; false; }; } && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
          done
