<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#303030" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F8F6F2" media="(prefers-color-scheme: light)">
<title>bursa.term</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bursa.term">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preload" href="fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="terminal.css?v=__V__">
<script>
  // 🎨 自定义主题 (终端版 AI 面板里设定，存在这台设备)：在画面出来之前先套上，不会闪一下默认颜色
  try { var bt = JSON.parse(localStorage.getItem('bterm_custom_theme') || 'null'); if (bt && bt.on && bt.vars) { var rs = document.documentElement.style;
    for (var k in bt.vars) rs.setProperty('--' + k, bt.vars[k]); if (bt.t && bt.t.scheme) rs.colorScheme = bt.t.scheme; document.documentElement.dataset.custom = '1'; } } catch (e) {}
</script>
</head>
<body>
<div class="term">
  <header class="top">
    <p class="prompt"><span class="u">user@bursa</span>:<span class="d">~</span>$ report --market MY <span id="prompt-arg"></span><span class="cur" aria-hidden="true"></span></p>
    <p class="status" id="status">loading…</p>
    <nav class="keys" id="keys" aria-label="页面"></nav>
  </header>
  <main id="main" tabindex="-1"><p class="dim">读取数据中…</p></main>
  <footer class="foot">
    <p><a id="full-report" href="../?ui=std">⚙ 标准风格</a> · <button type="button" id="theme-btn">[t] 主题</button> · <button type="button" id="lang-btn" lang="en">EN</button> · <span id="keys-help">键盘 1–7 切页、/ 搜索、k 空心 / 实心K线、q 返回</span></p>
    <p class="dim" id="disclaimer">仅供研究参考，不构成投资建议 · 数据 Yahoo Finance、Bursa (经 KLSE Screener)、Google News</p>
    <p class="dim legal-line">© __YEAR__ __CO_NAME__ · All rights reserved · <a id="legal-link" href="legal.html">使用条款与免责声明</a></p>
  </footer>
</div>
<!-- 手机：底部浮动玻璃导航栏 (7 页，可以左右滑)；电脑用上面的 [1]–[7] -->
<nav class="tabbar" id="tabbar" aria-label="页面"></nav>
<script src="terminal_en.js?v=__V__"></script>
<script src="terminal.js?v=__V__"></script>
</body>
</html>
